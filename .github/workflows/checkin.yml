name: AbleSci Auto Check-in

on:
  schedule:
    # UTC 22:00 = 北京时间 06:00 启动，随机延迟 0~1 小时
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # ===== 随机延迟：仅定时任务执行，手动触发跳过 =====
      - name: Random delay (6:00-7:00 北京时间之间执行)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 7200))
          echo "🎲 随机延迟 $((DELAY / 60)) 分 $((DELAY % 60)) 秒后开始签到"
          sleep $DELAY

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run check-in
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ABLESCI_ACCOUNTS: ${{ secrets.ABLESCI_ACCOUNTS }}
          PUSH_SERVERCHAN_KEY: ${{ secrets.PUSH_SERVERCHAN_KEY }}
          PUSH_TELEGRAM_BOT_TOKEN: ${{ secrets.PUSH_TELEGRAM_BOT_TOKEN }}
          PUSH_TELEGRAM_CHAT_ID: ${{ secrets.PUSH_TELEGRAM_CHAT_ID }}
          PUSH_FEISHU_WEBHOOK: ${{ secrets.PUSH_FEISHU_WEBHOOK }}
          PUSH_DINGTALK_WEBHOOK: ${{ secrets.PUSH_DINGTALK_WEBHOOK }}
        run: python checkin.py
